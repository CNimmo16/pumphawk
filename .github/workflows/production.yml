name: CI and production deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pumphawk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pumphawk_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pumphawk -d pumphawk_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://pumphawk:ci-only-password@127.0.0.1:5432/pumphawk_test
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi
      - run: git diff --exit-code -- packages/openapi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Validate native SDK and iOS/Android JavaScript bundles
        run: pnpm native:check
      - run: pnpm build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pumphawk-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      VITE_RELEASE: ${{ github.sha }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve production account, database and origin
        run: node scripts/production-config.mjs
        env:
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
      - name: Build API Worker with source maps
        run: pnpm --filter @pump-hawk/api exec wrangler deploy --dry-run --outdir dist --upload-source-maps --config wrangler.production.json
      - name: Build web Worker with source maps
        run: pnpm --filter @pump-hawk/web build
      - name: Inject and upload API source maps to PostHog
        if: env.POSTHOG_PROJECT_TOKEN != ''
        uses: PostHog/upload-source-maps@v0.5.7.0
        with:
          directory: services/api/dist
          env-id: ${{ vars.POSTHOG_PROJECT_ID }}
          cli-token: ${{ secrets.POSTHOG_CLI_TOKEN }}
          host: ${{ env.POSTHOG_HOST == 'https://eu.i.posthog.com' && 'https://eu.posthog.com' || 'https://us.posthog.com' }}
          project: pump-hawk-api
          version: ${{ github.sha }}
      - name: Inject and upload web source maps to PostHog
        if: env.POSTHOG_PROJECT_TOKEN != ''
        uses: PostHog/upload-source-maps@v0.5.7.0
        with:
          directory: apps/web/dist
          env-id: ${{ vars.POSTHOG_PROJECT_ID }}
          cli-token: ${{ secrets.POSTHOG_CLI_TOKEN }}
          host: ${{ env.POSTHOG_HOST == 'https://eu.i.posthog.com' && 'https://eu.posthog.com' || 'https://us.posthog.com' }}
          project: pump-hawk-web
          version: ${{ github.sha }}
      - name: Remove browser source maps before deployment
        run: find apps/web/dist/client -type f -name '*.map' -delete
      - name: Apply database migrations and genuine history
        run: |
          pnpm db:migrate
          pnpm data:bootstrap
      - name: Deploy API Worker
        # Deploy the injected bundle unchanged so its frames match the uploaded maps.
        run: pnpm --filter @pump-hawk/api exec wrangler deploy dist/index.js --no-bundle --upload-source-maps --config wrangler.production.json
      - name: Configure API secrets
        run: node scripts/production-secrets.mjs
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          ONE_AUTO_API_KEY: ${{ secrets.ONE_AUTO_API_KEY }}
      - name: Deploy web Worker
        run: pnpm --filter @pump-hawk/web exec wrangler deploy --no-bundle
      - name: Verify deployed application
        run: |
          curl --fail --retry 6 --retry-all-errors --retry-delay 10 "$PRODUCTION_ORIGIN/api/health"
          curl --fail --retry 6 --retry-all-errors --retry-delay 10 "$PRODUCTION_ORIGIN/" --output /dev/null
      - name: Bootstrap feeds and verify both production models
        run: node scripts/production-smoke.mjs
        env:
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
