name: pump-hawk
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55435:5432"
    environment:
      POSTGRES_USER: pumphawk
      POSTGRES_PASSWORD: pumphawk
      POSTGRES_DB: pumphawk
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumphawk -d pumphawk"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
